# Configuración del sink: Redis Streams
#
# NOTA: Debezium Server 2.5 no incluye un sink `file`. Los módulos de sink
# disponibles en v2.5.0.Final son: kafka, kinesis, pubsub, pulsar, eventhubs,
# redis, http, nats-streaming, nats-jetstream, pravega, rabbitmq, rocketmq, sqs
# e infinispan. Se usa Redis porque no necesita un clúster de Kafka y ofrece
# consumer groups con ack por mensaje; para inspeccionar los eventos capturados,
# export-events.py los vuelca a cdc-output/cdc_events.json.
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379

# Configuración del origen: conector de PostgreSQL
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# Credenciales de conexión a la base de datos
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=inventory_db

# Prefijo con el que se forman los nombres de los topics de Kafka (o de los
# streams de salida): el stream resultante es inventory.public.products
debezium.source.topic.prefix=inventory
debezium.source.plugin.name=pgoutput

# Se conserva el evento DELETE pero se descarta el tombstone adicional, que el
# sink de Redis guardaría como un evento con payload vacío.
debezium.source.tombstones.on.delete=false

# Por defecto las columnas NUMERIC/DECIMAL se emiten como Decimal de Kafka
# Connect, es decir, bytes en base64 ("Cic=" en lugar de 25.99). `double` hace
# legible el `price` capturado al inspeccionar los eventos.
debezium.source.decimal.handling.mode=double

# Capturar solo la tabla de origen. Debezium crea la publicación de PostgreSQL
# como FOR ALL TABLES, así que sin esto las propias escrituras del processor en
# el esquema analytics se capturarían, reemitirían y reprocesarían en bucle.
debezium.source.table.include.list=public.products

# La publicación de PostgreSQL se crea solo con las tablas de table.include.list
# (no FOR ALL TABLES), así que el WAL de analytics ni se decodifica. Requiere que
# public.products exista al arrancar el conector (la crea sql/init/).
debezium.source.publication.autocreate.mode=filtered