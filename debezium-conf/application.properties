# Sink configuration: Redis Streams
#
# NOTE: the exercise statement asks for `debezium.sink.type=file`, but Debezium
# Server 2.5 ships no `file` sink. The available sink modules at v2.5.0.Final are:
# kafka, kinesis, pubsub, pulsar, eventhubs, redis, http, nats-streaming,
# nats-jetstream, pravega, rabbitmq, rocketmq, sqs and infinispan.
# Redis is used instead as the lightweight local sink (no Kafka cluster needed),
# and the captured events are dumped to cdc-output/cdc_events.json by
# export-events.py so that Step 6 of the exercise can be carried out.
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379

# Source configuration: PostgreSQL Connector
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# Database connection credentials
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=inventory_db

# Prefix used to form the names of Kafka topics (or output stream names)
debezium.source.topic.prefix=tutorial
debezium.source.plugin.name=pgoutput

# Keep the DELETE event itself but drop the extra tombstone record, which the
# Redis sink would otherwise store as an event with an empty payload.
debezium.source.tombstones.on.delete=false

# By default NUMERIC/DECIMAL columns are emitted as a Kafka Connect Decimal, i.e.
# base64-encoded bytes ("Cic=" instead of 25.99). `double` makes the captured
# `price` readable when inspecting the events in Step 6.
debezium.source.decimal.handling.mode=double

# Only capture the source table. Debezium creates the PostgreSQL publication as
# FOR ALL TABLES, so without this the processor's own writes to the analytics
# schema would be captured, re-emitted and re-processed in an endless loop.
debezium.source.table.include.list=public.products