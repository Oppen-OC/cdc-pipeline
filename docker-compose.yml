services:
  # 1. Base de datos de origen
  postgres:
    image: postgres:15-alpine
    container_name: postgres_source
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inventory_db
    # Imprescindible: Debezium necesita PostgreSQL con replicación lógica activada.
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de init solo se ejecutan con el volumen vacío.
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante el initdb la imagen levanta un servidor temporal
      # que solo escucha por socket Unix; sin -h el healthcheck daría "healthy"
      # antes de que terminen los scripts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. Redis: sink ligero para los eventos CDC (sin necesidad de Kafka).
  #    Debezium Server 2.5 no incluye sink `file`, así que los eventos van a un
  #    stream de Redis y después se exportan a cdc-output/cdc_events.json.
  #    La persistencia append-only conserva los eventos capturados entre reinicios.
  redis:
    image: redis:7-alpine
    container_name: redis_sink
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Debezium Server (modo standalone, no requiere Kafka)
  debezium:
    image: debezium/server:2.5
    container_name: debezium_server
    volumes:
      - ./debezium-conf:/debezium/conf
      # Volumen con nombre (no bind mount) para que `down -v` también borre los
      # offsets; si no, tras reiniciar Debezium reanudaría en un LSN obsoleto y
      # omitiría los primeros eventos.
      - debezium-data:/debezium/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 4. Processor: consume el stream de Redis y escribe en la tabla de analítica.
  processor:
    build: ./processor
    container_name: cdc_processor
    hostname: processor-1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM=inventory.public.products
      - REDIS_GROUP=analytics-processor
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=inventory_db
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - VAT_RATE=0.21
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 5. API REST de lectura sobre PostgreSQL.
  api:
    build: ./api
    container_name: products_api
    ports:
      - "8000:8000"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=inventory_db
      - PGUSER=postgres
      - PGPASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  debezium-data:
